<div class="gallery" id="gallery"></div><footer>两段静坐各145帧；动耳朵与打哈欠各146帧；左右张望和舔毛各193帧；均为24 FPS原速视频动作。显示画布为1024 × 640；左右跑动用于专心模式，此页可离线播放并逐帧查看。</footer>
