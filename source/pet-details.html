<main>
 <header><span class="eyebrow">SUMMER THE CAT <span class="page-label">／ 宠物详情</span></span><span id="status" class="status" role="status">正在认识夏天</span></header>
 <section class="hero" aria-label="宠物介绍"><div class="portrait"><img id="portrait" alt="夏天的形象" hidden><span class="portrait-mark">YOUR LITTLE COMPANION</span></div><div><h1 id="name">夏天</h1><p id="english" class="english">Summer The Cat</p><p id="intro" class="intro"></p><div id="tags" class="tags"></div></div></section>
 <div class="section-title"><h2>认识我</h2><span class="note">藏在毛色里的小小特征</span></div><section id="features" class="features" aria-label="外貌特征"></section>
 <div class="section-title"><h2>我的日常</h2><span id="action-count" class="note"></span></div><section id="actions" class="actions" aria-label="日常动作"></section>
 <section class="interaction" aria-label="与宠物互动"><div><h2 id="interaction-title">陪夏天待一会儿</h2><p>鼠标在夏天四周停留，它会伸爪回应；也会随机静坐、动耳朵、张望、打哈欠和舔毛。</p></div><div class="buttons"><button id="play" class="primary" data-action="play">播放</button><button id="pause" data-action="pause">暂停</button><button id="replay" data-action="replay">重新播放</button></div></section>
 <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
 <div class="help"><span><b>拖动</b>换个位置</span><span><b>轻点</b>继续播放</span><span><b>右键</b>打开菜单</span></div>
 <footer><span id="footer-name">Summer The Cat</span><span>你的桌面小伙伴</span></footer>
</main>
<script>
'use strict';
let profile;
const byId=id=>document.getElementById(id),make=(tag,className,text)=>{const e=document.createElement(tag);e.className=className;e.textContent=text;return e};
window.loadProfile=function(p){profile=p;document.title=p.name+' · 宠物详情';byId('name').textContent=p.nickname;byId('english').textContent=p.name;byId('intro').textContent=p.introduction;byId('footer-name').textContent=p.name;byId('interaction-title').textContent='陪'+p.nickname+'待一会儿';byId('tags').replaceChildren(...p.tags.map(t=>make('span','tag',t)));byId('features').replaceChildren(...p.features.map((f,i)=>{const card=make('article','feature','');card.append(make('div','feature-index',String(i+1).padStart(2,'0')),make('h3','',f.title),make('p','',f.text));return card}));byId('action-count').textContent=p.actions.length+' 种陪伴方式';byId('actions').replaceChildren(...p.actions.map(a=>make('span','action',a)));byId('portrait').src=p.portrait;byId('portrait').alt=p.nickname+'的形象';byId('portrait').hidden=!p.portrait;for(const id of ['play','pause','replay'])byId(id).disabled=!p.available.includes(p.defaultState);updatePetStatus(p.status);window.detailsDebug={ready:true,name:p.name,nickname:p.nickname,actions:p.actions.length,features:p.features.length};};
window.updatePetStatus=function(value){byId('status').textContent=value;};
window.showFeedback=function(text){byId('feedback').textContent=text;};
for(const button of document.querySelectorAll('[data-action]'))button.addEventListener('click',()=>{const action=button.dataset.action;if(window.webkit?.messageHandlers?.details)window.webkit.messageHandlers.details.postMessage({type:'action',action});else showFeedback('此页面为预览，互动请在桌面应用中使用。');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.webkit?.messageHandlers?.details?.postMessage({type:'action',action:'close'});});
</script>
